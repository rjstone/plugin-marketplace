# Actions are pinned to commit SHAs (the version is in the comment).
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Generated catalogs are up to date
        run: node scripts/build.ts --check
      - name: Type-check config and scripts
        run: npm run typecheck
      - name: Validate the Claude Code catalog
        run: npx -y @anthropic-ai/claude-code@2.1.332 plugin validate .
